<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing Here</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background-color: #f4f4f0;
            position: relative;
            user-select: none;
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .floating-roast {
            position: absolute;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.12);
            white-space: nowrap;
            animation: floatAround 10s linear infinite;
        }

        .content-box {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            max-width: 90%;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #222;
            font-size: 2.2rem;
        }

        .kidding-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 20px;
            display: inline-block;
            animation: ngejekParah 0.6s infinite alternate ease-in-out;
        }

        .re-terminal {
            font-family: 'Courier New', Courier, monospace;
            background-color: #111;
            color: #00ff41;
            border: 3px solid #000;
            box-shadow: 6px 6px 0px #ff0055;
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 600px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
            font-weight: bold;
            transform: rotate(1deg);
            animation: glitchShake 2.5s infinite;
        }

        .mock-btn {
            display: inline-block;
            padding: 14px 34px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #000;
            background-color: #ffeb3b;
            border: 3px solid #000;
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 6px 6px 0px #000;
            transform: rotate(-3deg);
            animation: ledek 1.2s infinite ease-in-out;
            transition: all 0.15s ease;
        }

        .mock-btn::after {
            content: " 🤪";
        }

        .mock-btn:hover {
            background-color: #ff5722;
            color: #fff;
            transform: scale(1.15) rotate(6deg);
            box-shadow: 10px 10px 0px #000;
            animation: none;
        }

        .mock-btn:hover::after {
            content: " 😜👉";
        }

        .mock-btn:active {
            transform: scale(0.95) rotate(0deg);
            box-shadow: 2px 2px 0px #000;
        }

        @keyframes ledek {
            0%, 100% { transform: rotate(-3deg) translateY(0); }
            25% { transform: rotate(3deg) translateY(-6px); }
            50% { transform: rotate(-4deg) translateY(0); }
            75% { transform: rotate(2deg) translateY(-4px); }
        }

        @keyframes ngejekParah {
            0% { transform: scale(1) rotate(-4deg) skewX(-5deg); color: #ff0055; }
            50% { transform: scale(1.12) rotate(4deg) skewX(5deg); color: #ff9900; }
            100% { transform: scale(0.95) rotate(-2deg) skewX(-8deg); color: #d600ff; }
        }

        @keyframes glitchShake {
            0%, 100% { transform: rotate(1deg) translate(0, 0); }
            92% { transform: rotate(1deg) translate(0, 0); }
            94% { transform: rotate(-2deg) translate(-4px, 2px); }
            96% { transform: rotate(2deg) translate(4px, -2px); }
            98% { transform: rotate(0deg) translate(-2px, -2px); }
        }

        @keyframes floatAround {
            0% { transform: translateY(100vh) rotate(-10deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(10deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>

    <div class="content-box">
        <h1>Nothing available here 🙄</h1>
        <div class="kidding-text">Are you kidding me?! 🤡</div>
        <div class="re-terminal" id="roastBox">
            [0xDEADCAFE]: Still searching for plaintext strings in binary? Good luck lol.
        </div>
        <a href="https://t.me/kipascommunity" class="mock-btn">Click me</a>
    </div>

    <script>
        const reRoasts = [
            "[0xDEADCAFE]: Still searching for plaintext strings in binary? Good luck lol.",
            "[PTRACE_DENIED]: Nice debugger attachment attempt. Did your tutorial skip anti-tamper?",
            "[SEGFAULT_IQ]: Bro opened Ghidra once and thinks he can bypass the checksum.",
            "[XREF_NOT_FOUND]: Looking for cross-references? The only xref here points to your skill issue.",
            "[FRIDA_DETECTED]: Your copy-pasted hook script just got nuked at offset 0x0000DEAD.",
            "[STRIPPED_ELF]: Imagine crying over a stripped binary with bogus control flow flattening.",
            "[BAD_METADATA]: Did your memory dump fail again? Go rebuild that corrupted header, kiddo.",
            "[NOP_SLIDE]: Patching conditional jumps with 0x90 won't fix your brain's logic error.",
            "[XOR_LAUGHING]: Defeated by a simple dynamic XOR key and custom VM opcode? Pathetic.",
            "[IDA_FREEWARE]: Stare at that decompiled pseudocode all day, you still won't find the caller."
        ];

        const bgFloatingTerms = [
            "0xDEADBEEF", "sub_401000()", "libil2cpp.so", "Ptrace_Traceme", 
            "Skill Issue Detected", "Corrupted VTable", "Fake Offset Lmao", 
            "Anti-Dump Triggered", "Stack Smashing", "0x90 0x90 0x90", 
            "No Xrefs For You", "Obfuscated Trash", "Nice Breakpoint Bro"
        ];

        const roastBox = document.getElementById("roastBox");
        let currentIndex = 0;

        setInterval(() => {
            currentIndex = (currentIndex + 1) % reRoasts.length;
            roastBox.textContent = reRoasts[currentIndex];
        }, 2800);

        const bgLayer = document.getElementById("bgLayer");
        for (let i = 0; i < 18; i++) {
            const span = document.createElement("span");
            span.className = "floating-roast";
            span.textContent = bgFloatingTerms[Math.floor(Math.random() * bgFloatingTerms.length)];
            span.style.left = Math.random() * 90 + "vw";
            span.style.fontSize = (Math.random() * 1.2 + 0.8) + "rem";
            span.style.animationDuration = (Math.random() * 6 + 6) + "s";
            span.style.animationDelay = (Math.random() * 5) + "s";
            bgLayer.appendChild(span);
        }
    </script>
</body>
</html>
